name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages is already enabled on the repo with the GitHub Actions source,
      # so this only reads the config. Do not add `enablement: true` — the
      # default GITHUB_TOKEN cannot create a Pages site and the step fails.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is a single index.html at the repo root — no build step.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
