<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The BIZ Fest — Business · Entrepreneurship · Education</title>
<meta name="description" content="The BIZ Fest — where business, entrepreneurship, and education meet.">
<meta name="theme-color" content="#14171A">

<meta property="og:type" content="website">
<meta property="og:title" content="The BIZ Fest">
<meta property="og:description" content="Where business, entrepreneurship, and education meet.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314171A'/><text x='50' y='68' font-family='Helvetica,Arial,sans-serif' font-size='52' font-weight='700' fill='%232DD4BF' text-anchor='middle'>B</text></svg>">

<style>
  :root {
    --bg: #14171A;
    --bg-glow: #1C2126;
    --accent: #2DD4BF;
    --accent-hover: #14B8A6;
    --accent-light: #5EEAD4;
    --text: #F5F6F7;
    --muted: #8B939B;
    --footer: #4B5157;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 90% 75% at 50% 45%, var(--bg-glow) 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 46rem;
    padding: clamp(1.5rem, 5vw, 3rem);
    text-align: center;
  }

  /* --- Eyebrow --- */
  .eyebrow {
    margin: 0;
    font-size: clamp(0.55rem, 2vw, 0.7rem);
    font-weight: 500;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* --- Wordmark + pulse --- */
  .wordmark-wrap {
    position: relative;
    margin: clamp(1.75rem, 6vh, 3rem) 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pulse {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(clamp(10rem, 34vw, 17rem), 40vh);
    aspect-ratio: 1;
    margin: 0;
    border: 1px solid var(--accent);
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.55);
    animation: pulse-out 9s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
    pointer-events: none;
    z-index: 0;
  }

  .pulse--2 { animation-delay: 4.5s; }

  @keyframes pulse-out {
    0%   { opacity: 0;    transform: translate(-50%, -50%) scale(0.55); }
    12%  { opacity: 0.22; }
    55%  { opacity: 0.07; }
    100% { opacity: 0;    transform: translate(-50%, -50%) scale(2.1); }
  }

  .wordmark {
    position: relative;
    z-index: 1;
    margin: 0;
    font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
    line-height: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wordmark .the {
    font-size: clamp(0.7rem, 2.6vw, 1rem);
    font-weight: 500;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .wordmark .biz {
    display: block;
    margin: clamp(0.35rem, 1.4vh, 0.7rem) 0;
    font-size: clamp(4.5rem, 22vw, 11rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .wordmark .fest {
    font-size: clamp(1.1rem, 5.4vw, 2.4rem);
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--accent);
    text-transform: uppercase;
  }

  /* --- Tagline --- */
  .tagline {
    margin: clamp(1.75rem, 5vh, 2.75rem) auto 0;
    max-width: 30rem;
    font-size: clamp(0.85rem, 2.6vw, 1.0625rem);
    font-weight: 400;
    line-height: 1.6;
    color: var(--muted);
  }

  /* --- Button --- */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    margin-top: clamp(1.75rem, 5vh, 2.75rem);
    padding: 0.95em 1.9em;
    border-radius: 999px;
    background: var(--accent);
    color: #0B0E10;
    font-family: inherit;
    font-size: clamp(0.85rem, 2.4vw, 0.9375rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    transition: background-color 0.2s ease, transform 0.2s ease;
  }

  .cta:hover { background: var(--accent-hover); }
  .cta:active { transform: translateY(1px); }

  .cta:focus-visible {
    outline: 2px solid var(--accent-light);
    outline-offset: 4px;
  }

  .cta svg {
    width: 0.85em;
    height: 0.85em;
    flex: none;
  }

  /* --- Footer --- */
  .footer {
    margin: clamp(2.5rem, 8vh, 4.5rem) 0 0;
    font-size: clamp(0.6875rem, 2vw, 0.75rem);
    letter-spacing: 0.06em;
    color: var(--footer);
  }

  /* --- Very narrow phones: keep the eyebrow on one line --- */
  @media (max-width: 380px) {
    .eyebrow { letter-spacing: 0.18em; text-indent: 0.18em; }
  }

  /* --- Short viewports: tighten so nothing scrolls --- */
  @media (max-height: 560px) {
    .wordmark-wrap { margin-top: 1.25rem; }
    .wordmark .biz { font-size: clamp(3rem, 13vh, 6rem); }
    .tagline { margin-top: 1.25rem; }
    .cta { margin-top: 1.25rem; }
    .footer { margin-top: 1.75rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; opacity: 0.12; }
    .cta { transition: none; }
    .cta:active { transform: none; }
  }
</style>
</head>
<body>

<main>
  <p class="eyebrow">Business · Entrepreneurship · Education</p>

  <div class="wordmark-wrap">
    <span class="pulse pulse--1" aria-hidden="true"></span>
    <span class="pulse pulse--2" aria-hidden="true"></span>

    <h1 class="wordmark">
      <span class="the">The</span>
      <span class="biz">BIZ</span>
      <span class="fest">Fest</span>
    </h1>
  </div>

  <p class="tagline">Where business, entrepreneurship, and education meet.</p>

  <a class="cta" href="https://www.linkedin.com/in/mauricio-barajas-209739428" target="_blank" rel="noopener noreferrer">
    Connect on LinkedIn
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M7 17 17 7"></path>
      <path d="M8 7h9v9"></path>
    </svg>
  </a>

  <p class="footer">The BIZ Fest — an event brand.</p>
</main>

</body>
</html>
