<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The BIZ Fest — Business · Entrepreneurship · Education</title>
<meta name="description" content="The BIZ Fest — where business, entrepreneurship, and education meet. Connect on LinkedIn.">
<meta name="theme-color" content="#14171A">

<meta property="og:type" content="website">
<meta property="og:title" content="The BIZ Fest">
<meta property="og:description" content="Where business, entrepreneurship, and education meet.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2314171A'/><text x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='%232DD4BF' text-anchor='middle'>B</text></svg>">

<style>
  :root {
    --bg: #14171A;
    --bg-glow: #1C2126;
    --teal: #2DD4BF;
    --teal-hover: #14B8A6;
    --teal-light: #5EEAD4;
    --text: #F5F6F7;
    --muted: #8B939B;
    --footer: #4B5157;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: clamp(1.5rem, 5vw, 3rem);
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 90% 70% at 50% 45%, var(--bg-glow) 0%, var(--bg) 62%);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 44rem;
    text-align: center;
  }

  /* ---- eyebrow ---- */
  .eyebrow {
    position: relative;
    z-index: 1;
    margin: 0;
    font-size: clamp(0.56rem, 1.9vw, 0.72rem);
    font-weight: 500;
    letter-spacing: 0.34em;
    text-indent: 0.34em; /* keep optically centred despite tracking */
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ---- wordmark ---- */
  .mark {
    position: relative;
    margin-top: clamp(1.75rem, 5vw, 2.75rem);
  }

  .wordmark {
    position: relative;
    z-index: 1;
    margin: 0;
    font-family: "Space Grotesk", "Inter", sans-serif;
    line-height: 1;
  }

  .wordmark .the {
    display: block;
    font-size: clamp(0.85rem, 3.2vw, 1.35rem);
    font-weight: 500;
    letter-spacing: 0.52em;
    text-indent: 0.52em;
    color: var(--text);
    text-transform: uppercase;
  }

  .wordmark .biz {
    display: block;
    margin: clamp(0.35rem, 1.4vw, 0.6rem) 0;
    font-size: clamp(4.5rem, 25vw, 13rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.92;
    color: var(--text);
  }

  .wordmark .fest {
    display: block;
    font-size: clamp(1.15rem, 5.2vw, 2.5rem);
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--teal);
  }

  /* ---- pulsing rings ---- */
  .rings {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(27rem, 76vmin);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }

  .ring {
    position: absolute;
    inset: 0;
    border: 1px solid var(--teal);
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.35);
    animation: pulse 11s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
  }

  .ring:nth-child(2) { animation-delay: 5.5s; }

  @keyframes pulse {
    0%   { opacity: 0;    transform: scale(0.35); }
    12%  { opacity: 0.24; }
    55%  { opacity: 0.06; }
    70%, 100% { opacity: 0; transform: scale(1.15); }
  }

  /* ---- tagline ---- */
  .tagline {
    position: relative;
    z-index: 1;
    margin: clamp(1.6rem, 4.5vw, 2.4rem) auto 0;
    max-width: 32ch;
    font-size: clamp(0.9rem, 2.6vw, 1.05rem);
    font-weight: 400;
    line-height: 1.6;
    color: var(--muted);
  }

  /* ---- cta ---- */
  .cta {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    margin-top: clamp(1.75rem, 4.5vw, 2.5rem);
    padding: 0.95em 1.85em;
    border-radius: 999px;
    background: var(--teal);
    color: var(--bg);
    font-size: clamp(0.88rem, 2.4vw, 0.98rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    transition: background-color 0.25s ease, transform 0.25s ease;
  }

  .cta:hover { background: var(--teal-hover); }
  .cta:active { transform: translateY(1px); }

  .cta:focus-visible {
    outline: 2px solid var(--teal-light);
    outline-offset: 4px;
  }

  .cta svg {
    width: 0.85em;
    height: 0.85em;
    flex: none;
  }

  /* ---- footer ---- */
  .footnote {
    position: relative;
    z-index: 1;
    margin: clamp(2.25rem, 6vw, 3.25rem) 0 0;
    font-size: clamp(0.68rem, 2vw, 0.78rem);
    letter-spacing: 0.06em;
    color: var(--footer);
  }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none; opacity: 0.09; transform: scale(0.78); }
    .ring:nth-child(2) { transform: scale(1.05); opacity: 0.05; }
    .cta { transition: none; }
  }

  /* narrow phones: tighten tracking so the eyebrow stays on one line */
  @media (max-width: 420px) {
    .eyebrow { font-size: 0.55rem; letter-spacing: 0.18em; text-indent: 0.18em; }
  }

  /* very short viewports: tighten so nothing scrolls */
  @media (max-height: 560px) {
    .mark { margin-top: 1.25rem; }
    .wordmark .the { font-size: clamp(0.75rem, 2.6vh, 1.1rem); }
    .wordmark .biz { font-size: clamp(3rem, 14vh, 6rem); }
    .wordmark .fest { font-size: clamp(1rem, 4.2vh, 1.6rem); }
    .tagline { margin-top: 1rem; }
    .cta { margin-top: 1.25rem; padding: 0.75em 1.5em; }
    .footnote { margin-top: 1.5rem; }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Business · Entrepreneurship · Education</p>

    <div class="mark">
      <div class="rings" aria-hidden="true">
        <span class="ring"></span>
        <span class="ring"></span>
      </div>

      <h1 class="wordmark">
        <span class="the">The</span>
        <span class="biz">BIZ</span>
        <span class="fest">Fest</span>
      </h1>
    </div>

    <p class="tagline">Where business, entrepreneurship, and education meet.</p>

    <a class="cta" href="https://www.linkedin.com/in/mauricio-barajas-209739428" target="_blank" rel="noopener noreferrer">
      Connect on LinkedIn
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.5 11.5 11.5 4.5"></path>
        <path d="M5.5 4.5h6v6"></path>
      </svg>
    </a>

    <p class="footnote">© 2026 The BIZ Fest</p>
  </main>
</body>
</html>
